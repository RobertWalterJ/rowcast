<title>RowCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*MAPLIBRE_CSS*/
/* Layout: full-screen phone app. Map is the home screen; four more screens slide in above a bottom tab bar. Glass panels float over the map. */
:root{
  --bg:#F4F6F6; --surface:#FFFFFF; --glass:rgba(255,255,255,.86); --sunk:#EBEFF0; --ink:#0E1B22; --muted:#5A6A72; --line:#D8DFE2;
  --accent:#0B6E82; --accent-ink:#FFFFFF; --accent-soft:#DDF0F3;
  --go:#178A55; --caution:#C27A00; --stop:#C8322A; --info:#3563B5;
  --port:#1E8E4E; --stbd:#D13A2E; --magenta:#B0177F;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 6px 24px rgba(10,30,40,.14),0 1px 3px rgba(10,30,40,.10);
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1115; --surface:#121B21; --glass:rgba(16,24,30,.86); --sunk:#0E161B; --ink:#E5EDF0; --muted:#8FA1AA; --line:#23323A;
  --accent:#4FB7CB; --accent-ink:#04222A; --accent-soft:#12313A;
  --go:#46C487; --caution:#F2A93B; --stop:#FF6A5F; --info:#86A9EC; --port:#3DBB76; --stbd:#FF6A5F; --magenta:#E05BB4;
  --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1115; --surface:#121B21; --glass:rgba(16,24,30,.86); --sunk:#0E161B; --ink:#E5EDF0; --muted:#8FA1AA; --line:#23323A;
  --accent:#4FB7CB; --accent-ink:#04222A; --accent-soft:#12313A;
  --go:#46C487; --caution:#F2A93B; --stop:#FF6A5F; --info:#86A9EC; --port:#3DBB76; --stbd:#FF6A5F; --magenta:#E05BB4;
  --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}
/* night-vision mode: red-shifted UI for pre-dawn rows */
:root.night{--bg:#050404; --surface:#0D0807; --glass:rgba(14,8,7,.9); --sunk:#090505; --ink:#E07A6A; --muted:#8C4A40; --line:#2A1512;
  --accent:#D0503F; --accent-ink:#1A0604; --accent-soft:#2A100C; --go:#9A6A3A; --caution:#C8603A; --stop:#FF4A3A; --info:#B0584A; color-scheme:dark}
html,body{height:100%;overscroll-behavior:none}
/* App feel: no pull-to-refresh, no long-press text selection or callouts on the UI, no double-tap zoom delay. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,[contenteditable],.selectable{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;overflow:hidden;padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
#app{position:relative;height:100%;overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px)) 0;overflow:hidden}
.screen.page{overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 16px 24px;background:var(--bg)}
.screen[hidden]{display:none!important}
.page-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.page h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}

/* ---------- top bar ---------- */
.topbar{position:absolute;z-index:30;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px}
.ctx{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer;text-align:left}
.ctx .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.ctx .t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.ctx b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bottom nav ---------- */
.nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:6px;width:52px;height:30px;border-radius:15px;background:var(--accent-soft);z-index:-1}
.nav .badge{position:absolute;top:8px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--caution);border:2px solid var(--surface)}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:#F1F2EE}
#wxCanvas,#ptCanvas{position:absolute;inset:0;pointer-events:none;z-index:5}
.maplibregl-ctrl-attrib{font-size:10px}
.mapfab{position:absolute;z-index:20;right:12px;display:flex;flex-direction:column;gap:8px}
.chips{position:absolute;z-index:20;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;flex:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 11px;font-size:.8rem;font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.timebar{position:absolute;z-index:20;left:12px;right:12px;bottom:12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;grid-row:span 2}
.play svg{width:18px;height:18px}
.play.sm{width:40px;height:40px;grid-row:auto;flex:none}
.radarbar{position:absolute;z-index:21;left:12px;right:12px;bottom:96px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:10px;align-items:center}
.rdrmid{flex:1;min-width:0}.rdrtop{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
#rdrSlider{width:100%;height:32px;accent-color:var(--accent);margin:-4px 0}
body.radar-on .legendmini{bottom:196px}
.lim{font-size:.72rem;color:var(--muted);margin-top:-2px}
.sharerow{display:flex;gap:8px;flex-wrap:wrap}
.loglist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.logcard{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.lgtxt{display:flex;flex-direction:column;gap:3px;min-width:0}.lgchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.lgchips i{font-style:normal;font-size:.72rem;font-weight:700;background:var(--sunk);border-radius:999px;padding:3px 9px;color:var(--muted)}
.trk{width:150px;height:84px;flex:none;background:var(--sunk);border-radius:10px}
.insight p{margin:0 0 8px;line-height:1.45}.insight p:last-child{margin:0}
.form{display:flex;flex-direction:column;gap:14px}
.cardcv{width:100%;height:auto;border-radius:16px;display:block;box-shadow:var(--shadow)}
.ltg .top{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ltg .bolt{font-size:1.2rem}.ltgmain{font-size:1.05rem;margin:6px 0 4px}.ltg .note{font-size:.78rem;color:var(--muted)}
.ltg.stop{border-color:var(--stop);box-shadow:inset 6px 0 0 var(--stop)}.ltg.caution{border-color:var(--caution);box-shadow:inset 6px 0 0 var(--caution)}
.watchrow{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.alertbar{position:absolute;z-index:80;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:8px}
.alertitem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--caution);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.alertitem.stop{border-left-color:var(--stop)}.alertitem.go{border-left-color:var(--go)}
.alertitem > div{flex:1;min-width:0}.alertitem .x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted)}
.wcap .top{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wcbar{display:inline-flex;gap:3px}.wcbar i{width:22px;height:8px;border-radius:3px;display:inline-block}
.wcword{font-size:1.3rem;font-weight:800;margin:6px 0 4px}.wcap .note{font-size:.8rem;color:var(--muted)}
.runlist{display:flex;flex-direction:column;gap:10px}.runrow{display:flex;gap:10px;align-items:flex-start}
.runrow .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}
.spark{width:100%;height:60px;display:block;margin-top:8px}
.lkey{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.lkey span{display:inline-flex;align-items:center;gap:5px}.lkey i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.timelbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.82rem}
.timelbl b{font-size:.95rem}
#hourSlider{width:100%;height:44px;accent-color:var(--accent);margin:-8px 0;touch-action:pan-y}
.daytrack{position:relative;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk);grid-column:2;margin-top:-2px}
.daytrack i{position:absolute;top:0;bottom:0}
.readcard{position:absolute;z-index:25;left:12px;right:12px;bottom:96px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.readcard .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.3rem;line-height:1}
.readgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px 14px;flex:1;min-width:0}
.readgrid div{display:flex;flex-direction:column}
.readgrid .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.readgrid .v{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.drawbar{position:absolute;z-index:26;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.drawbar button{border:0;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer}
.legendmini{position:absolute;z-index:20;left:12px;bottom:110px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.72rem;display:flex;flex-direction:column;gap:4px;max-width:60%}
.ramp{height:8px;border-radius:4px;width:130px}

/* ---------- sheets & drawer ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(5,15,20,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:70;left:0;right:0;bottom:0;max-height:86%;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px;gap:10px}
.sheet .sh-head h2{font-size:1.15rem;font-weight:800}
.sheet .sh-body{overflow-y:auto;padding:4px 18px 20px;display:flex;flex-direction:column;gap:14px}
.drawer{position:absolute;z-index:70;top:0;bottom:0;left:0;width:min(86%,360px);background:var(--surface);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.drawer header{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
.drawer header img{width:28px;height:42px;object-fit:contain;transform:rotate(-35deg)}
.drawer header b{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.drawer .dbody{overflow-y:auto;padding:0 10px 20px;display:flex;flex-direction:column;gap:2px}
.dsec{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.ditem:hover{background:var(--sunk)}
.ditem[aria-current="true"]{background:var(--accent-soft)}
.ditem .ic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}
.ditem .ic svg{width:19px;height:19px}
.ditem .tx{display:flex;flex-direction:column;min-width:0}
.ditem .tx span{font-size:.78rem;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.layer{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:700;cursor:pointer;position:relative}
.layer canvas{width:44px;height:30px;border-radius:7px}
.layer[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.layer[aria-pressed="true"]::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.full{width:100%}
.field{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.boatpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.boatpick button{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:800}
.boatpick button img{height:54px;width:auto}
.boatpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- legend ---------- */
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.lg div{display:flex;align-items:center;gap:10px;font-size:.84rem}
.lg canvas{width:34px;height:24px;flex:none}
.lg-h{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* ---------- row call ---------- */
.verdict{display:flex;gap:16px;align-items:center}
.vring{width:112px;height:112px;flex:none;position:relative}
.vring svg{width:100%;height:100%}
.vring .w{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.05rem;line-height:1.05}
.vtitle{font-size:1.8rem;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.c-go{color:var(--go)} .c-caution{color:var(--caution)} .c-stop{color:var(--stop)} .c-none{color:var(--muted)}
.wchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.wchips .chip{background:var(--surface);box-shadow:none;backdrop-filter:none}
.wchips .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.factors{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.factor{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.factor .top{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.factor .val{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.factor .val small{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:2px}
.factor .note{font-size:.8rem;color:var(--muted)}
.gauge{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--go) 0 var(--a),var(--caution) var(--a) var(--b),var(--stop) var(--b));position:relative;opacity:.9}
.gauge i{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk)}
.pill.go{color:var(--go)} .pill.caution{color:var(--caution)} .pill.stop{color:var(--stop)}

/* ---------- forecast ---------- */
.ribbon{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.ribbon svg{display:block}
.ribbon text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--surface)}
.day b{font-size:.9rem}
.day .big{font-size:1.2rem;font-weight:800}

/* ---------- light ---------- */
.dial{width:100%;max-width:340px;margin:0 auto;display:block}
.dial text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.ltimes{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.ltimes div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.ltimes b{font-family:var(--f-mono);font-weight:500}
.lamps{display:flex;gap:5px}
.lamps i{width:12px;height:12px;border-radius:50%}

/* ---------- races ---------- */
.event{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.event .hero{height:150px;position:relative;background:var(--sunk)}
.event .hero canvas{width:100%;height:100%;display:block}
.event .hero .tag{position:absolute;left:12px;top:12px}
.event .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.event h2{font-size:1.3rem;font-weight:800}
.race{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.race img{height:64px;width:auto;justify-self:center}
.race .cd{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.race .cd small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.tl{grid-column:1/-1;display:flex;gap:0;align-items:stretch;margin-top:4px}
.tl div{flex:1;border-top:3px solid var(--line);padding-top:6px;font-size:.74rem;color:var(--muted)}
.tl div b{display:block;color:var(--ink);font-family:var(--f-mono);font-size:.84rem;font-weight:500}
.tl div.on{border-color:var(--accent)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--glass);border:1px solid var(--line)}
.tag.ex{color:var(--caution);border-color:var(--caution)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.toast{position:absolute;z-index:90;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.proto{font-size:.72rem;color:var(--muted);text-align:center;padding:6px}
@media (prefers-reduced-motion:reduce){.sheet,.drawer,.scrim{transition:none}}
</style>

<div id="app">

    <canvas id="wxCanvas"></canvas>

      <button class="iconbtn" id="btnMode" aria-label="Map style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".4"/><path d="M5.6 5.6c3 3 9.8 3 12.8 0M5.6 18.4c3-3 9.8-3 12.8 0" opacity=".4"/></svg></button>

    </div>
    <div class="legendmini" id="legendMini"></div>
    <div class="readcard" id="readCard" hidden></div>
    <div class="drawbar" id="drawBar" hidden><div style="flex:1"><b id="drawLen">0 m</b><div class="small" style="opacity:.75">Tap along the water to trace the course</div></div><button id="drawUndo" style="background:transparent;color:inherit;border:1px solid rgba(255,255,255,.3)">Undo</button><button id="drawDone" style="background:var(--accent);color:var(--accent-ink)">Save</button></div>

    </div>
  </section>

  <!-- CALL -->
  <section class="screen page" id="s-call" hidden><div class="page-inner" id="callInner"></div></section>
  <!-- FORECAST -->
  <section class="screen page" id="s-fc" hidden><div class="page-inner" id="fcInner"></div></section>
  <!-- LIGHT -->
  <section class="screen page" id="s-light" hidden><div class="page-inner" id="lightInner"></div></section>
  <!-- RACES -->
  <section class="screen page" id="s-races" hidden><div class="page-inner" id="racesInner"></div></section>

  <!-- top bar (shared) -->

    <button class="iconbtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="ctx" id="ctxBtn"><span class="dot" id="ctxDot"></span><span class="t"><b id="ctxName">—</b><span id="ctxSub">—</span></span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;flex:none;opacity:.6"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="iconbtn" id="btnNight" aria-label="Night vision"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
  </div>

  <!-- bottom nav -->
  <nav class="nav" aria-label="Sections">
    <button data-s="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button data-s="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Row call<i class="badge" id="callBadge" hidden></i></button>
    <button data-s="fc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>Forecast</button>

  </nav>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-head"><h2 id="sheetTitle"></h2><button class="iconbtn" style="width:44px;height:44px;box-shadow:none" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sh-body" id="sheetBody"></div></div>
  <div class="alertbar" id="alertBar" hidden></div>
  <div class="toast" id="toast"></div>
</div>
